[project]
name = "cptcopro"
version = "0.1.0"
description = "Suivi Compte Copro"
authors = [
    {name = "Therealcorwin"}
]
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "selectolax (>=0.4.11,<0.5.0)",
    "streamlit (>=1.60.0,<2.0.0)",
    "streamlit-extras (>=1.6.0,<2.0.0)",
    "plotly-express (>=0.4.1,<0.5.0)",
    "loguru (>=0.7.3,<0.8.0)",
    "playwright (>=1.61.0,<2.0.0)",
    "rich (>=15.0.0,<16.0.0)",
    "pcloud-sdk-python (>=1.0.1,<2.0.0)",
    "pandas (>=2.0.0,<3.0.0)",
    "python-dotenv (>=1.0.0,<2.0.0)",
    "msal (>=1.37.0,<2.0.0)",
    "dotenv (>=0.9.9,<0.10.0)",
    "graphifyy (>=0.9.48,<0.10.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]
